apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "node-sample-api.fullname" . }}-v2
  labels:
    {{- include "node-sample-api.labels" . | nindent 4 }}
    app.kubernetes.io/version: "v2"
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "node-sample-api.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/version: "v2"
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "node-sample-api.labels" . | nindent 8 }}
        app.kubernetes.io/version: "v2"
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "node-sample-api.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          env:
            - name: MONGO_URI
              value: "mongodb://mongodb.mongodb:27017/test_database"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http # port name to use in the service target port: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            ## Additional for metrics
            # - name: metrics
            #   containerPort: {{ .Values.service.metricsPort }}
            #   protocol: TCP
            ## Additional for metrics
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        # Redis container
        - name: redis
          image: redis:latest
          ports:
            - containerPort: 6379
        # NGINX container with updated port configuration
        - name: test-additional-image
          image: 533267176850.dkr.ecr.us-east-1.amazonaws.com/sample-api-nginx:dev-nginx-latest
          ports:
            - containerPort: 8080
          command: ["/bin/sh"]
          args:
            - "-c"
            - |
              echo "server {
                      listen 8080;
                      location / {
                          root /usr/share/nginx/html;
                          index index.html index.htm;
                      }
                  }" > /etc/nginx/conf.d/default.conf
              nginx -g 'daemon off;'
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}